<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GF Diversiones - Estado de Resultados</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'DM Sans',sans-serif; background:#f5f3ef; color:#1a1a1a; }
::-webkit-scrollbar { width:4px; }
::-webkit-scrollbar-thumb { background:#ccc; border-radius:4px; }
select { -webkit-appearance:none; appearance:none; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

// ╔══════════════════════════════════════════════════════════════╗
// ║  CONFIGURA TU URL DE APPS SCRIPT AQUÍ                       ║
// ║  Después de implementar Code_Utilidades.gs, pega la URL:    ║
// ╚══════════════════════════════════════════════════════════════╝
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyGeAlUq8zC9jvfFuecLXIDuUlRHE7GG_hVi8a5kNWsv_kquhXahwWYFR_UQN3nm42w/exec";  // ← Pega aquí tu URL de implementación

// ── Helpers ──
const fmt = (n) => { if(n===null||n===undefined||isNaN(n))return"—"; const a=Math.abs(n); if(a>=1e6)return(n<0?"-":"")+"$"+(a/1e6).toFixed(2)+"M"; return(n<0?"-":"")+"$"+a.toLocaleString("es-MX",{minimumFractionDigits:0,maximumFractionDigits:0}); };
const fmtPct = (n) => { if(n===null||n===undefined||isNaN(n))return"—"; return(n*100).toFixed(1)+"%"; };
const fmtNum = (n) => (n===null||n===undefined||isNaN(n))?"—":n.toLocaleString("es-MX");
const sumField = (arr, f) => arr.reduce((s,r) => s+(r[f]||0), 0);
const FIELDS = ["tickets","ventaTotal","ventaNeta","diferencia","pTarjeta","efectivo","sueldos","extras","gastos","faltantes","gastosSuc","efectivoNeto","utBrutSuc","finiquitos","nomina","gastosMayores","rentas","manttos","socComer","ebitda","imss","impuestos","utNeta"];
const aggregate = (rows) => { const d={}; FIELDS.forEach(f=>d[f]=sumField(rows,f)); return d; };

// ── JSONP Fetch ──
let jsonpCounter = 0;
function fetchJSONP(url) {
  return new Promise((resolve, reject) => {
    const cbName = "__utilidades_cb_" + (++jsonpCounter);
    const script = document.createElement("script");
    const timeout = setTimeout(() => { cleanup(); reject(new Error("Timeout")); }, 15000);
    function cleanup() { clearTimeout(timeout); delete window[cbName]; if(script.parentNode) script.parentNode.removeChild(script); }
    window[cbName] = (data) => { cleanup(); resolve(data); };
    script.src = url + (url.indexOf("?")>=0?"&":"?") + "callback=" + cbName;
    script.onerror = () => { cleanup(); reject(new Error("Network error")); };
    document.body.appendChild(script);
  });
}

// ── Colors ──
const C = { bg:"#f5f3ef", textPrimary:"#1a1a1a", textSecondary:"#6b7280", textMuted:"#9ca3af", border:"#e5e2dc",
  ingreso:{bg:"#ecfdf5",border:"#34d399",text:"#065f46",accent:"#10b981"},
  cobro:{bg:"#eff6ff",border:"#60a5fa",text:"#1e40af",accent:"#3b82f6"},
  gastoSuc:{bg:"#fef2f2",border:"#f87171",text:"#991b1b",accent:"#ef4444"},
  operativo:{bg:"#f0fdf4",border:"#86efac",text:"#166534",accent:"#22c55e"},
  gastoMat:{bg:"#fdf4ff",border:"#c084fc",text:"#6b21a8",accent:"#a855f7"},
  fiscal:{bg:"#fff7ed",border:"#fb923c",text:"#9a3412",accent:"#f97316"},
  ebitda:{bg:"#fefce8",border:"#facc15",text:"#854d0e",accent:"#eab308"},
  utNeta:{bg:"#f0f9ff",border:"#0ea5e9",text:"#0c4a6e",accent:"#0284c7"},
};

// ── Components ──
const Section = ({title,total,children,defaultOpen=false,colors}) => {
  const[open,setOpen]=useState(defaultOpen);
  return(
    <div style={{marginBottom:6,borderRadius:12,overflow:"hidden",border:"1px solid "+colors.border+"30",background:colors.bg}}>
      <button onClick={()=>setOpen(!open)} style={{width:"100%",display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 16px",border:"none",cursor:"pointer",background:"transparent",fontFamily:"'DM Sans', sans-serif"}}>
        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:4,height:20,borderRadius:2,background:colors.accent}}/>
          <span style={{fontSize:13,fontWeight:700,color:colors.text,letterSpacing:"0.03em",textTransform:"uppercase"}}>{title}</span>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <span style={{fontFamily:"'JetBrains Mono', monospace",fontSize:14,fontWeight:700,color:colors.text}}>{total}</span>
          <span style={{fontSize:10,color:colors.accent,transform:open?"rotate(180deg)":"rotate(0)",transition:"transform 0.2s"}}>▼</span>
        </div>
      </button>
      {open&&<div style={{borderTop:"1px solid "+colors.border+"25"}}>{children}</div>}
    </div>
  );
};

const LineItem = ({label,value,isTotal,indent,negative}) => {
  const isNeg=negative||(typeof value==="string"&&value.startsWith("-"));
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:(isTotal?12:9)+"px 16px",paddingLeft:indent?36:16,background:isTotal?"rgba(0,0,0,0.02)":"transparent",borderBottom:"1px solid rgba(0,0,0,0.04)"}}>
      <span style={{fontFamily:"'DM Sans', sans-serif",fontSize:13,fontWeight:isTotal?700:400,color:isTotal?C.textPrimary:C.textSecondary}}>{label}</span>
      <span style={{fontFamily:"'JetBrains Mono', monospace",fontSize:13,fontWeight:isTotal?700:500,color:isNeg?"#dc2626":isTotal?C.textPrimary:C.textSecondary}}>{value}</span>
    </div>
  );
};

const BigResult = ({label,value,colors,negative}) => {
  const isNeg=negative||(typeof value==="string"&&value.startsWith("-"));
  return(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:16,margin:"6px 0",borderRadius:12,background:isNeg?"#fef2f2":colors.bg,border:"2px solid "+(isNeg?"#fca5a5":colors.border)}}>
      <span style={{fontFamily:"'DM Sans', sans-serif",fontSize:14,fontWeight:800,color:isNeg?"#991b1b":colors.text,letterSpacing:"0.03em"}}>{label}</span>
      <span style={{fontFamily:"'JetBrains Mono', monospace",fontSize:17,fontWeight:800,color:isNeg?"#dc2626":colors.accent}}>{value}</span>
    </div>
  );
};

const KPI = ({label,value,sub,color,subColor}) => (
  <div style={{flex:"1 1 45%",minWidth:140,padding:14,borderRadius:12,background:"#fff",border:"1px solid "+C.border,boxShadow:"0 1px 3px rgba(0,0,0,0.04)"}}>
    <div style={{fontFamily:"'DM Sans', sans-serif",fontSize:10,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:6}}>{label}</div>
    <div style={{fontFamily:"'JetBrains Mono', monospace",fontSize:20,fontWeight:700,color:color||C.textPrimary}}>{value}</div>
    {sub&&<div style={{fontFamily:"'DM Sans', sans-serif",fontSize:11,color:subColor||C.textMuted,marginTop:4,fontWeight:600}}>{sub}</div>}
  </div>
);

const RATIO_OPTIONS = [
  {key:"ventaTotal",label:"Venta Total"},{key:"ventaNeta",label:"Venta Neta"},
  {key:"gastosSuc",label:"Gastos Sucursal"},{key:"gastosMatriz",label:"Gastos Matriz"},
  {key:"gastosTotales",label:"Gastos Totales"},{key:"utBrutSuc",label:"Ut. Bruta Suc"},
  {key:"ebitda",label:"EBITDA"},{key:"utNeta",label:"Utilidad Neta"},
  {key:"nomina",label:"Nómina"},{key:"rentas",label:"Rentas"},{key:"sueldos",label:"Sueldos"},
];

const MESES_ORDER = ["ENERO","FEBRERO","MARZO","ABRIL","MAYO","JUNIO","JULIO","AGOSTO","SEPTIEMBRE","OCTUBRE","NOVIEMBRE","DICIEMBRE"];

// ── Main App ──
function App() {
  const [allData, setAllData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [connected, setConnected] = useState(false);
  const [lastSync, setLastSync] = useState(null);
  const [diagResult, setDiagResult] = useState(null);

  const [month, setMonth] = useState("");
  const [branch, setBranch] = useState("GLOBAL");
  const [showMenu, setShowMenu] = useState(false);
  const [ratioNum, setRatioNum] = useState("utNeta");
  const [ratioDen, setRatioDen] = useState("ventaNeta");

  // Cargar datos
  const loadData = useCallback(async () => {
    setLoading(true);
    setError(null);

    // Intentar desde Apps Script
    if (APPS_SCRIPT_URL) {
      try {
        const data = await fetchJSONP(APPS_SCRIPT_URL);
        if (data && !data.error) {
          setAllData(data);
          setConnected(true);
          setLastSync(new Date().toLocaleTimeString("es-MX"));
          localStorage.setItem("utilidades_data", JSON.stringify(data));
          localStorage.setItem("utilidades_sync", new Date().toISOString());
          setLoading(false);
          return;
        }
      } catch (e) {
        console.warn("Apps Script no disponible, usando cache...", e);
      }
    }

    // Fallback a localStorage
    const cached = localStorage.getItem("utilidades_data");
    if (cached) {
      try {
        setAllData(JSON.parse(cached));
        setConnected(false);
        const syncDate = localStorage.getItem("utilidades_sync");
        if (syncDate) setLastSync(new Date(syncDate).toLocaleTimeString("es-MX"));
        setLoading(false);
        return;
      } catch (e) {}
    }

    // Sin datos
    setError(APPS_SCRIPT_URL 
      ? "No se pudo conectar al Sheets y no hay datos en caché." 
      : "Configura la URL de Apps Script en el archivo HTML.");
    setLoading(false);
  }, []);

  const runDiag = useCallback(async () => {
    setDiagResult("⏳ Inyectando <script> tag de prueba (igual que JSONP real)...");
    const cbName = "__diag_" + Date.now();

    const result = await new Promise((resolve) => {
      const script = document.createElement("script");
      const timer = setTimeout(() => {
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve({ type: "timeout" });
      }, 12000);

      window[cbName] = (data) => {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve({ type: "success", data });
      };

      script.onerror = () => {
        clearTimeout(timer);
        delete window[cbName];
        if (script.parentNode) script.parentNode.removeChild(script);
        resolve({ type: "scripterror" });
      };

      script.src = APPS_SCRIPT_URL + "?callback=" + cbName;
      document.body.appendChild(script);
    });

    if (result.type === "success") {
      if (result.data && result.data.error) {
        setDiagResult(
          "⚠️ JSONP llegó pero el script devolvió error:\n\n" +
          JSON.stringify(result.data, null, 2) +
          "\n\nRevisa los logs en Apps Script → Ejecuciones."
        );
      } else {
        const meses = Object.keys(result.data || {});
        setDiagResult(
          "✅ JSONP funciona correctamente.\n" +
          "Meses con datos: " + (meses.length ? meses.join(", ") : "ninguno — el Sheets no tiene hojas con nombre de mes") +
          "\n\nPreview:\n" + JSON.stringify(result.data).slice(0, 600)
        );
      }
    } else if (result.type === "scripterror") {
      setDiagResult(
        "❌ El <script> tag disparó onerror.\n\n" +
        "Causas posibles:\n" +
        "• La URL no existe o fue eliminada\n" +
        "• La implementación fue despublicada\n" +
        "• El script retorna un Content-Type que el navegador rechaza\n\n" +
        "Acción: Abre esta URL en el navegador y revisa qué responde:\n" +
        APPS_SCRIPT_URL + "?callback=test"
      );
    } else {
      setDiagResult(
        "⏰ Timeout — el callback nunca llegó (12s).\n\n" +
        "El servidor responde (confirmado antes) pero el script\n" +
        "no ejecuta el callback. Causas más comunes:\n\n" +
        "1. La hoja no tiene hojas con nombre en MAYÚSCULAS\n" +
        "   (ENERO, FEBRERO…). Verifica los nombres exactos.\n\n" +
        "2. El script está tardando más de 12s (hoja muy grande).\n\n" +
        "3. Error silencioso en doGet antes del return.\n\n" +
        "Acción: Abre esta URL en el navegador para ver la respuesta cruda:\n" +
        APPS_SCRIPT_URL + "?callback=test"
      );
    }
  }, []);

  useEffect(() => { loadData(); }, [loadData]);

  // Meses disponibles ordenados
  const availableMonths = useMemo(() => {
    if (!allData) return [];
    return MESES_ORDER.filter(m => allData[m] && allData[m].length > 0);
  }, [allData]);

  // Seleccionar último mes disponible por defecto
  useEffect(() => {
    if (availableMonths.length > 0 && !month) {
      setMonth(availableMonths[availableMonths.length - 1]);
    }
  }, [availableMonths, month]);

  const monthData = (allData && allData[month]) || [];

  const branches = useMemo(() => {
    if (!allData) return ["GLOBAL"];
    const all = new Set();
    Object.values(allData).forEach(rows => {
      if (Array.isArray(rows)) rows.forEach(r => { if(r.sucursal) all.add(r.sucursal); });
    });
    return ["GLOBAL", ...Array.from(all)];
  }, [allData]);

  const data = useMemo(() => {
    if (branch === "GLOBAL") return aggregate(monthData);
    return monthData.find(r => r.sucursal === branch) || aggregate([]);
  }, [month, branch, monthData]);

  const gastosMatriz = (data.finiquitos||0)+(data.nomina||0)+(data.gastosMayores||0)+(data.rentas||0)+(data.manttos||0)+(data.socComer||0);
  const gastosTotales = (data.gastosSuc||0)+gastosMatriz;
  const margenEbitda = data.ventaNeta ? data.ebitda/data.ventaNeta : 0;
  const margenUtNeta = data.ventaNeta ? data.utNeta/data.ventaNeta : 0;
  const globalData = useMemo(() => aggregate(monthData), [monthData]);
  const pctOfGlobalUtNeta = globalData.utNeta ? (data.utNeta/globalData.utNeta) : 0;

  const prevMonthIdx = availableMonths.indexOf(month) - 1;
  const prevData = useMemo(() => {
    if (prevMonthIdx < 0 || !allData) return null;
    const prevRows = allData[availableMonths[prevMonthIdx]] || [];
    if (branch === "GLOBAL") return aggregate(prevRows);
    return prevRows.find(r => r.sucursal === branch) || null;
  }, [month, branch, prevMonthIdx, allData, availableMonths]);

  const pctChangeVN = prevData && prevData.ventaNeta ? ((data.ventaNeta - prevData.ventaNeta) / Math.abs(prevData.ventaNeta)) : null;

  const changeBadge = (pct) => {
    if (pct === null) return <span style={{fontSize:11,color:C.textMuted}}>Sin periodo anterior</span>;
    const up = pct >= 0;
    return <span style={{fontSize:11,fontWeight:600,color:up?"#16a34a":"#dc2626"}}>{up?"▲":"▼"} {Math.abs(pct*100).toFixed(1)}% vs {availableMonths[prevMonthIdx]?.slice(0,3)}</span>;
  };

  const getVal = (key) => {
    if (key === "gastosMatriz") return gastosMatriz;
    if (key === "gastosTotales") return gastosTotales;
    return data[key] || 0;
  };
  const ratioValue = getVal(ratioDen) ? getVal(ratioNum)/getVal(ratioDen) : 0;

  // ── Loading State ──
  if (loading) {
    return (
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.bg,gap:16}}>
        <div style={{width:40,height:40,border:"3px solid #e5e2dc",borderTop:"3px solid #0284c7",borderRadius:"50%",animation:"spin 1s linear infinite"}}/>
        <div style={{fontSize:14,color:C.textSecondary}}>Conectando con Sheets...</div>
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    );
  }

  // ── Error State ──
  if (error) {
    return (
      <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:C.bg,padding:32,textAlign:"center",gap:16}}>
        <div style={{fontSize:40}}>⚠️</div>
        <div style={{fontSize:16,fontWeight:700,color:C.textPrimary}}>Sin conexión</div>
        <div style={{fontSize:13,color:C.textSecondary,maxWidth:300,lineHeight:1.6}}>{error}</div>
        <button onClick={loadData} style={{padding:"10px 24px",borderRadius:10,border:"none",background:"#0284c7",color:"#fff",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans', sans-serif"}}>Reintentar</button>
        <button onClick={runDiag} style={{padding:"10px 24px",borderRadius:10,border:"1px solid #d97706",background:"#fff7ed",color:"#9a3412",fontSize:13,fontWeight:700,cursor:"pointer",fontFamily:"'DM Sans', sans-serif"}}>🔍 Diagnóstico</button>
        {diagResult && (
          <div style={{marginTop:12,padding:14,borderRadius:10,background:"#1a1a1a",color:"#f0f0f0",fontFamily:"'JetBrains Mono', monospace",fontSize:11,whiteSpace:"pre-wrap",wordBreak:"break-all",textAlign:"left",maxWidth:440,maxHeight:300,overflowY:"auto",lineHeight:1.6}}>
            {diagResult}
          </div>
        )}
      </div>
    );
  }

  // ── Main UI ──
  return (
    <div style={{minHeight:"100vh",background:C.bg,color:C.textPrimary,fontFamily:"'DM Sans', sans-serif",maxWidth:520,margin:"0 auto"}}>
      {/* Header */}
      <div style={{padding:"20px 16px 12px",background:"#fff",borderBottom:"1px solid "+C.border}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:14}}>
          <div>
            <div style={{fontSize:10,letterSpacing:"0.15em",color:C.textMuted,textTransform:"uppercase",fontWeight:700}}>GF DIVERSIONES · GRUPO ROKMA</div>
            <div style={{fontSize:20,fontWeight:800,marginTop:2,letterSpacing:"-0.02em"}}>Estado de Resultados</div>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:8}}>
            <div style={{padding:"4px 10px",borderRadius:8,background:"#f0f9ff",border:"1px solid #bae6fd"}}>
              <span style={{fontFamily:"'JetBrains Mono', monospace",fontSize:11,fontWeight:700,color:"#0284c7"}}>{fmtNum(data.tickets)} tickets</span>
            </div>
            {/* Connection indicator */}
            <div onClick={loadData} style={{cursor:"pointer",width:10,height:10,borderRadius:"50%",background:connected?"#22c55e":"#f59e0b",border:"2px solid "+(connected?"#16a34a":"#d97706"),title:connected?"Conectado":"Offline"}}/>
          </div>
        </div>

        {/* Month tabs */}
        <div style={{display:"flex",gap:6,overflowX:"auto",paddingBottom:8}}>
          {availableMonths.map(m =>
            <button key={m} onClick={() => setMonth(m)} style={{padding:"7px 16px",borderRadius:20,border:"none",cursor:"pointer",fontSize:12,fontWeight:700,fontFamily:"'DM Sans', sans-serif",whiteSpace:"nowrap",transition:"all 0.2s",background:m===month?"#0284c7":"#f1f5f9",color:m===month?"#fff":C.textSecondary}}>{m.slice(0,3)}</button>
          )}
        </div>

        {/* Branch selector */}
        <div style={{position:"relative",marginTop:8}}>
          <button onClick={() => setShowMenu(!showMenu)} style={{width:"100%",padding:"10px 14px",borderRadius:10,border:"1px solid "+C.border,background:"#f8fafc",color:C.textPrimary,fontSize:14,fontWeight:600,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"'DM Sans', sans-serif"}}>
            <span style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:11,color:C.textMuted}}>SUCURSAL:</span>
              {branch==="GLOBAL"?"🌐 CONSOLIDADO GLOBAL":branch}
            </span>
            <span style={{fontSize:10,color:C.textMuted}}>▼</span>
          </button>
          {showMenu && (
            <div style={{position:"absolute",top:"100%",left:0,right:0,zIndex:100,background:"#fff",border:"1px solid "+C.border,borderRadius:10,marginTop:4,maxHeight:320,overflowY:"auto",boxShadow:"0 12px 40px rgba(0,0,0,0.12)"}}>
              {branches.map(b =>
                <button key={b} onClick={() => {setBranch(b);setShowMenu(false);}} style={{width:"100%",padding:"11px 14px",border:"none",cursor:"pointer",background:b===branch?"#f0f9ff":"transparent",color:b===branch?"#0284c7":C.textSecondary,fontSize:13,fontWeight:b===branch?700:400,textAlign:"left",fontFamily:"'DM Sans', sans-serif",borderBottom:"1px solid "+C.border+"40",display:"flex",alignItems:"center",gap:8}}>
                  {b==="GLOBAL"?"🌐 CONSOLIDADO GLOBAL":b}
                  {b!=="GLOBAL" && monthData.find(r=>r.sucursal===b) && <span style={{marginLeft:"auto",fontSize:11,color:C.textMuted}}>{monthData.find(r=>r.sucursal===b)?.producto}</span>}
                </button>
              )}
            </div>
          )}
        </div>
      </div>

      {/* KPIs */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,padding:"14px 16px 6px"}}>
        <KPI label="Venta Neta" value={fmt(data.ventaNeta)} sub={changeBadge(pctChangeVN)} subColor={pctChangeVN>=0?"#16a34a":"#dc2626"}/>
        <KPI label="EBITDA" value={fmt(data.ebitda)} color={data.ebitda>=0?"#16a34a":"#dc2626"} sub={fmtPct(margenEbitda)+" s/ ventas"}/>
        <KPI label="Utilidad Neta" value={fmt(data.utNeta)} color={data.utNeta>=0?"#0284c7":"#dc2626"} sub={fmtPct(margenUtNeta)+" s/ ventas"}/>
        <KPI label="Gastos Totales" value={fmt(gastosTotales)} sub={data.ventaNeta?fmtPct(gastosTotales/data.ventaNeta)+" s/ ventas":"—"}/>
      </div>

      {/* Estado de Resultados */}
      <div style={{padding:"8px 16px 40px"}}>
        <Section title="Ingresos" total={fmt(data.ventaNeta)} colors={C.ingreso} defaultOpen>
          <LineItem label="Venta Total" value={fmt(data.ventaTotal)}/>
          <LineItem label="Venta Neta" value={fmt(data.ventaNeta)} isTotal/>
          <LineItem label="Diferencia" value={fmt(data.diferencia)} negative={data.diferencia<0}/>
        </Section>

        <Section title="Medios de Cobro" total={fmt((data.pTarjeta||0)+(data.efectivo||0))} colors={C.cobro}>
          <LineItem label="Pago Tarjeta" value={fmt(data.pTarjeta)} indent/>
          <LineItem label="Efectivo" value={fmt(data.efectivo)} indent/>
        </Section>

        <Section title="Gastos de Sucursal" total={fmt(data.gastosSuc)} colors={C.gastoSuc}>
          <LineItem label="Sueldos" value={fmt(data.sueldos)} indent/>
          <LineItem label="Extras" value={fmt(data.extras)} indent/>
          <LineItem label="Gastos" value={fmt(data.gastos)} indent/>
          <LineItem label="Faltantes" value={fmt(data.faltantes)} indent/>
        </Section>

        <Section title="Resultado Operativo Suc." total={fmt(data.utBrutSuc)} colors={C.operativo}>
          <LineItem label="Efectivo Neto" value={fmt(data.efectivoNeto)}/>
          <LineItem label="Utilidad Bruta Suc." value={fmt(data.utBrutSuc)} isTotal/>
        </Section>

        <Section title="Gastos de Matriz" total={fmt(gastosMatriz)} colors={C.gastoMat}>
          <LineItem label="Finiquitos" value={fmt(data.finiquitos)} indent/>
          <LineItem label="Nómina (prorrateo)" value={fmt(data.nomina)} indent/>
          <LineItem label="Gastos Mayores" value={fmt(data.gastosMayores)} indent/>
          <LineItem label="Rentas" value={fmt(data.rentas)} indent/>
          <LineItem label="Mantenimientos" value={fmt(data.manttos)} indent/>
          <LineItem label="Soc. Comercial" value={fmt(data.socComer)} indent/>
        </Section>

        <BigResult label="EBITDA" value={fmt(data.ebitda)} colors={C.ebitda} negative={data.ebitda<0}/>

        <Section title="Deducciones Fiscales" total={fmt((data.imss||0)+(data.impuestos||0))} colors={C.fiscal}>
          <LineItem label="IMSS" value={fmt(data.imss)} indent/>
          <LineItem label="Impuestos" value={fmt(data.impuestos)} indent/>
        </Section>

        <BigResult label="UTILIDAD NETA" value={fmt(data.utNeta)} colors={C.utNeta} negative={data.utNeta<0}/>

        {/* Indicadores */}
        <div style={{marginTop:16,padding:16,borderRadius:12,background:"#fff",border:"1px solid "+C.border}}>
          <div style={{fontSize:11,fontWeight:700,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:12}}>Indicadores</div>
          <div style={{display:"flex",gap:12,marginBottom:16}}>
            <div style={{flex:1,textAlign:"center",padding:12,borderRadius:10,background:"#f0f9ff"}}>
              <div style={{fontSize:10,color:"#0c4a6e",letterSpacing:"0.06em",marginBottom:4}}>% EBITDA / VENTAS</div>
              <div style={{fontFamily:"'JetBrains Mono', monospace",fontSize:20,fontWeight:700,color:data.ebitda>=0?"#0284c7":"#dc2626"}}>{fmtPct(margenEbitda)}</div>
            </div>
            <div style={{flex:1,textAlign:"center",padding:12,borderRadius:10,background:branch==="GLOBAL"?"#f8fafc":"#fefce8"}}>
              <div style={{fontSize:10,color:branch==="GLOBAL"?"#64748b":"#854d0e",letterSpacing:"0.06em",marginBottom:4}}>
                {branch==="GLOBAL"?"% UT. NETA / VENTAS":"% DE UT. GLOBAL"}
              </div>
              <div style={{fontFamily:"'JetBrains Mono', monospace",fontSize:20,fontWeight:700,color:branch==="GLOBAL"?(data.utNeta>=0?"#0284c7":"#dc2626"):(pctOfGlobalUtNeta>=0?"#ca8a04":"#dc2626")}}>
                {branch==="GLOBAL"?fmtPct(margenUtNeta):fmtPct(pctOfGlobalUtNeta)}
              </div>
              {branch!=="GLOBAL"&&<div style={{fontSize:10,color:C.textMuted,marginTop:2}}>Ut. Neta suc / Ut. Neta total</div>}
            </div>
          </div>

          {/* Calculadora de Ratio */}
          <div style={{borderTop:"1px solid "+C.border,paddingTop:14}}>
            <div style={{fontSize:11,fontWeight:700,color:C.textMuted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:10}}>Calculadora de Ratio</div>
            <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
              <select value={ratioNum} onChange={e=>setRatioNum(e.target.value)} style={{flex:1,minWidth:120,padding:"8px 10px",borderRadius:8,border:"1px solid "+C.border,fontSize:12,fontFamily:"'DM Sans', sans-serif",fontWeight:600,background:"#f8fafc",color:C.textPrimary}}>
                {RATIO_OPTIONS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
              </select>
              <span style={{fontSize:16,fontWeight:800,color:C.textMuted}}>/</span>
              <select value={ratioDen} onChange={e=>setRatioDen(e.target.value)} style={{flex:1,minWidth:120,padding:"8px 10px",borderRadius:8,border:"1px solid "+C.border,fontSize:12,fontFamily:"'DM Sans', sans-serif",fontWeight:600,background:"#f8fafc",color:C.textPrimary}}>
                {RATIO_OPTIONS.map(o=><option key={o.key} value={o.key}>{o.label}</option>)}
              </select>
            </div>
            <div style={{marginTop:10,padding:12,borderRadius:10,background:"#f0f9ff",textAlign:"center"}}>
              <div style={{fontSize:10,color:"#0c4a6e",marginBottom:4}}>{RATIO_OPTIONS.find(o=>o.key===ratioNum)?.label} / {RATIO_OPTIONS.find(o=>o.key===ratioDen)?.label}</div>
              <div style={{fontFamily:"'JetBrains Mono', monospace",fontSize:24,fontWeight:800,color:ratioValue>=0?"#0284c7":"#dc2626"}}>{fmtPct(ratioValue)}</div>
              <div style={{fontSize:10,color:C.textMuted,marginTop:2}}>{fmt(getVal(ratioNum))} / {fmt(getVal(ratioDen))}</div>
            </div>
          </div>
        </div>

        {/* Detalle sucursal */}
        {branch!=="GLOBAL"&&data.razon&&(
          <div style={{padding:14,margin:"12px 0 0",borderRadius:10,background:"#fff",border:"1px solid "+C.border}}>
            <div style={{fontSize:11,color:C.textMuted,marginBottom:4}}>DETALLE SUCURSAL</div>
            <div style={{fontSize:12,color:C.textSecondary,lineHeight:1.7}}>
              Razón Social: <span style={{color:C.textPrimary,fontWeight:600}}>{data.razon}</span><br/>
              Producto: <span style={{color:C.textPrimary,fontWeight:600}}>{data.producto}</span>
            </div>
          </div>
        )}

        {/* Footer */}
        <div style={{textAlign:"center",padding:"20px 16px 4px",fontSize:10,color:C.textMuted}}>
          GF DIVERSIONES · GRUPO ROKMA · {month} 2026
        </div>
        <div style={{textAlign:"center",padding:"0 16px 8px",fontSize:9,color:C.textMuted}}>
          {connected ? "🟢" : "🟡"} {lastSync ? "Última sync: "+lastSync : "Sin conexión"} · <span onClick={loadData} style={{cursor:"pointer",textDecoration:"underline"}}>Actualizar</span> · <span onClick={runDiag} style={{cursor:"pointer",textDecoration:"underline",color:"#d97706"}}>Diagnóstico</span>
        </div>
        {diagResult && (
          <div style={{margin:"0 16px 16px",padding:14,borderRadius:10,background:"#1a1a1a",color:"#f0f0f0",fontFamily:"'JetBrains Mono', monospace",fontSize:11,whiteSpace:"pre-wrap",wordBreak:"break-all",lineHeight:1.6,maxHeight:300,overflowY:"auto"}}>
            <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
              <span style={{fontSize:10,color:"#9ca3af",textTransform:"uppercase",letterSpacing:"0.08em"}}>Respuesta cruda del Apps Script</span>
              <span onClick={()=>setDiagResult(null)} style={{cursor:"pointer",color:"#6b7280",fontSize:12}}>✕</span>
            </div>
            {diagResult}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
